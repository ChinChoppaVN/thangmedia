<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="droneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e35"/>
      <stop offset="100%" stop-color="#15181c"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#474f5a"/>
      <stop offset="100%" stop-color="#22272e"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="url(#droneGrad)" stroke="#3a4049" stroke-width="1.5"/>

  <!-- 4 Arms -->
  <line x1="32" y1="30" x2="18" y2="20" stroke="#3b424d" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="30" x2="46" y2="20" stroke="#3b424d" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="16" y2="44" stroke="#3b424d" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="48" y2="44" stroke="#3b424d" stroke-width="3" stroke-linecap="round"/>

  <!-- Motor Hubs -->
  <circle cx="18" cy="20" r="3.5" fill="#1e2227" stroke="#6b7280" stroke-width="1.2"/>
  <circle cx="46" cy="20" r="3.5" fill="#1e2227" stroke="#6b7280" stroke-width="1.2"/>
  <circle cx="16" cy="44" r="3.5" fill="#1e2227" stroke="#6b7280" stroke-width="1.2"/>
  <circle cx="48" cy="44" r="3.5" fill="#1e2227" stroke="#6b7280" stroke-width="1.2"/>

  <!-- Propeller Blades (Spinning Curves) -->
  <!-- Top Left -->
  <path d="M11 17c4-1 9 1 14 5" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <path d="M12 23c4-1 9-3 12-5" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <!-- Top Right -->
  <path d="M39 22c4-4 9-2 14-5" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <path d="M39 18c5 2 10 4 14 1" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <!-- Bottom Left -->
  <path d="M9 41c5-2 9 0 14 5" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <path d="M10 47c4-1 9-4 12-5" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <!-- Bottom Right -->
  <path d="M42 46c4-4 8-1 13-4" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <path d="M41 42c5 2 9 5 14 2" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>

  <!-- Drone Central Fuselage -->
  <polygon points="32,17 38,24 37,39 32,43 27,39 26,24" fill="url(#bodyGrad)" stroke="#525b68" stroke-width="1.2"/>
  <!-- Top Sensors & Canopy Lines -->
  <path d="M29 25h6" stroke="#f4623a" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="32" cy="30" r="2" fill="#111827"/>
  <line x1="32" y1="33" x2="32" y2="39" stroke="#6b7280" stroke-width="1"/>

  <!-- Front Gimbal 4K Camera Pod -->
  <rect x="29" y="14" width="6" height="5" rx="1.5" fill="#181b20" stroke="#f4623a" stroke-width="1"/>
  <circle cx="32" cy="16.5" r="1.5" fill="#0284c7"/>

  <!-- LED Indicators (Front Green, Rear Red) -->
  <circle cx="18" cy="20" r="1" fill="#10b981"/>
  <circle cx="46" cy="20" r="1" fill="#10b981"/>
  <circle cx="16" cy="44" r="1" fill="#ef4444"/>
  <circle cx="48" cy="44" r="1" fill="#ef4444"/>
</svg>
