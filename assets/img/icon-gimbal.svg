<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="gimbalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e35"/>
      <stop offset="100%" stop-color="#15181c"/>
    </linearGradient>
    <linearGradient id="gimbalMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a6370"/>
      <stop offset="100%" stop-color="#343a42"/>
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="100%" stop-color="#f4623a"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="url(#gimbalGrad)" stroke="#3a4049" stroke-width="1.5"/>
  <!-- Top: Camera Baseplate / Rig Mount -->
  <rect x="23" y="14" width="18" height="5" rx="2" fill="#22262c" stroke="#4b5563" stroke-width="1"/>
  <rect x="28" y="11" width="8" height="3" rx="1" fill="#f4623a"/>
  <!-- Tilt Arm & Motor -->
  <path d="M41 16h3c1.5 0 2.5 1 2.5 2.5v10c0 1.5-1 2.5-2.5 2.5h-5" stroke="url(#gimbalMetal)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="44" cy="22" r="3" fill="#181b20" stroke="url(#accentRed)" stroke-width="1.2"/>
  <!-- Roll Axis Curved Arm -->
  <path d="M21 21c0-2 1-3 3-3h15" stroke="url(#gimbalMetal)" stroke-width="2" stroke-linecap="round"/>
  <path d="M21 21v10c0 2 1.5 3.5 3.5 3.5h7.5" stroke="url(#gimbalMetal)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="21" cy="27" r="3" fill="#181b20" stroke="url(#accentRed)" stroke-width="1.2"/>
  <!-- Pan Axis Motor (Center Ring) -->
  <rect x="28" y="33" width="8" height="5" rx="2" fill="#1b1f24" stroke="#606975" stroke-width="1"/>
  <circle cx="32" cy="35.5" r="1.5" fill="#f4623a"/>
  <!-- Control Unit / OLED Display & Joystick -->
  <rect x="28" y="38" width="8" height="7" rx="1.5" fill="#20252b" stroke="#374151" stroke-width="1"/>
  <rect x="29.5" y="39.5" width="5" height="2.5" rx="0.5" fill="#0ea5e9"/>
  <circle cx="32" cy="43.5" r="1" fill="#9ca3af"/>
  <!-- Battery Grip Handle -->
  <rect x="29" y="45" width="6" height="11" rx="2" fill="#16181b" stroke="#374151" stroke-width="1"/>
  <!-- Grip Rubber Stripes -->
  <line x1="30" y1="48" x2="34" y2="48" stroke="#f4623a" stroke-width="0.8" opacity="0.8"/>
  <line x1="30" y1="50.5" x2="34" y2="50.5" stroke="#4b5563" stroke-width="0.8"/>
  <line x1="30" y1="53" x2="34" y2="53" stroke="#4b5563" stroke-width="0.8"/>
  <!-- Tripod Mini Feet at Bottom -->
  <path d="M27 56l2-1h6l2 1" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
</svg>
